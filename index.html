<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*;"
    />
    <title>Tether</title>
    <link rel="icon" href="/tether-icon.svg" type="image/svg+xml" />
    <script>
      document.documentElement.classList.remove("tether-ready");
      try {
        const nativeState = window.remoteMarkdown?.getUiStateSync?.() || {};
        const preferences = nativeState.preferences || JSON.parse(localStorage.getItem("remoteMarkdownPreview.preferences") || "{}");
        const accent = ["phosphor", "amber", "cobalt"].includes(preferences.accent) ? preferences.accent : "phosphor";
        const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const theme = ["dark", "light"].includes(preferences.theme) ? preferences.theme : systemTheme;
        document.documentElement.dataset.tetherAccent = accent;
        document.documentElement.dataset.tetherTheme = theme;
      } catch {
        document.documentElement.dataset.tetherAccent = "phosphor";
        document.documentElement.dataset.tetherTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #15181b;
      }

      html[data-tether-theme="light"],
      html[data-tether-theme="light"] body,
      html[data-tether-theme="light"] #root {
        background: #eaedee;
      }

      html:not(.tether-ready) #root {
        visibility: hidden;
      }

      html.tether-ready #root {
        visibility: visible;
      }

      #tether-boot {
        --boot-accent: #4dbe83;
        --boot-ink: #dee4e8;
        --boot-muted: #6e7882;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #15181b;
        opacity: 1;
        pointer-events: none;
        visibility: visible;
        transition:
          opacity 140ms ease,
          visibility 0s linear 140ms;
      }

      html[data-tether-accent="amber"] #tether-boot {
        --boot-accent: #d9a13c;
      }

      html[data-tether-accent="cobalt"] #tether-boot {
        --boot-accent: #6b96f2;
      }

      html[data-tether-theme="light"] #tether-boot {
        --boot-accent: #1f8754;
        --boot-ink: #14171a;
        --boot-muted: #7e878d;
        background: #eaedee;
      }

      html[data-tether-theme="light"][data-tether-accent="amber"] #tether-boot {
        --boot-accent: #9a6e1b;
      }

      html[data-tether-theme="light"][data-tether-accent="cobalt"] #tether-boot {
        --boot-accent: #2f62c4;
      }

      html.tether-ready #tether-boot {
        opacity: 0;
        visibility: hidden;
      }

      #tether-boot.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .tether-boot-glyph {
        width: 30px;
        height: 30px;
        overflow: visible;
      }

      .tether-boot-ping {
        animation: tetherBootPing 1.6s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes tetherBootPing {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.75);
        }
        12% {
          opacity: 1;
        }
        45% {
          opacity: 1;
          transform: translate(8.4px, -8.4px) scale(1);
        }
        58% {
          opacity: 0.35;
        }
        72% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(0, 0) scale(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div id="tether-boot" aria-hidden="true">
      <svg class="tether-boot-glyph" width="16" height="16" viewBox="0 0 16 16">
        <circle cx="3.6" cy="12.4" r="2.1" fill="var(--boot-accent)" />
        <path d="M5.4 10.6 C 7.4 8.6, 8.4 7.4, 10.4 5.4" stroke="var(--boot-muted)" stroke-width="1.2" fill="none" />
        <circle cx="12" cy="4" r="2.4" fill="none" stroke="var(--boot-ink)" stroke-width="1.6" />
        <circle class="tether-boot-ping" cx="3.6" cy="12.4" r="1.35" fill="var(--boot-accent)" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer/App.jsx"></script>
  </body>
</html>
